<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App Pro - Complete Version</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #f380d6 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            background: rgb(255, 190, 233);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(1,1,2,2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .todo-item {
            padding: 12px;
            background: white;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            transition: all 0.3s;
        }

        .todo-item:hover {
            box-shadow: 0 2px 8px rgba(1,2,0,1);
        }

        button {
            transition: all 0.3s ease;
            cursor: pointer;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        input, select {
            transition: all 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #007bff !important;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="text/babel">
        // ==================== useLocalStorage Hook ====================
        function useLocalStorage(key, initialValue) {
            const [value, setValue] = React.useState(() => {
                const saved = localStorage.getItem(key);
                if (saved) {
                    return JSON.parse(saved);
                }
                return initialValue;
            });

            React.useEffect(() => {
                localStorage.setItem(key, JSON.stringify(value));
            }, [value, key]);

            return [value, setValue];
        }

        // ==================== TodoForm Component ====================
        function TodoForm({ onAdd }) {
            const [text, setText] = React.useState('');
            const [priority, setPriority] = React.useState('medium');
            const [category, setCategory] = React.useState('personal');
            const [dueDate, setDueDate] = React.useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                if (text.trim() === '') return;
                
                onAdd({
                    text: text,
                    priority: priority,
                    category: category,
                    dueDate: dueDate,
                    createdAt: new Date().toISOString()
                });
                
                setText('');
                setPriority('medium');
                setCategory('personal');
                setDueDate('');
            };

            return (
                <form onSubmit={handleSubmit} style={{ marginBottom: '25px' }}>
                    <input
                        type="text"
                        value={text}
                        onChange={(e) => setText(e.target.value)}
                        placeholder="کار جدید... "
                        style={{
                            width: '100%',
                            padding: '12px',
                            border: '2px solid #ddd',
                            borderRadius: '8px',
                            marginBottom: '10px',
                            fontSize: '16px'
                        }}
                    />
                    
                    <div style={{ display: 'flex', gap: '10px', marginBottom: '10px', flexWrap: 'wrap' }}>
                        <select 
                            value={priority} 
                            onChange={(e) => setPriority(e.target.value)}
                            style={{ flex: 1, padding: '8px', borderRadius: '5px', border: '1px solid #ddd' }}
                        >
                            <option value="low">🟢 اولویت کم</option>
                            <option value="medium">🟡 اولویت متوسط</option>
                            <option value="high">🔴 اولویت بالا</option>
                        </select>
                        
                        <select 
                            value={category} 
                            onChange={(e) => setCategory(e.target.value)}
                            style={{ flex: 1, padding: '8px', borderRadius: '5px', border: '1px solid #ddd' }}
                        >
                            <option value="personal">👤 شخصی</option>
                            <option value="work">💼 کاری</option>
                            <option value="study">📚 درسی</option>
                            <option value="shopping">🛒 خرید</option>
                            <option value="health">🏃 سلامتی</option>
                        </select>
                        
                        <input
                            type="date"
                            value={dueDate}
                            onChange={(e) => setDueDate(e.target.value)}
                            style={{ flex: 1, padding: '8px', borderRadius: '5px', border: '1px solid #ddd' }}
                        />
                    </div>
                    
                    <button type="submit" style={{
                        width: '100%',
                        padding: '12px',
                        backgroundColor: '#28a745',
                        color: 'white',
                        border: 'none',
                        borderRadius: '8px',
                        fontSize: '16px',
                        cursor: 'pointer',
                        fontWeight: 'bold'
                    }}>
                        ➕ افزودن کار جدید
                    </button>
                </form>
            );
        }

        // ==================== TodoItem Component ====================
        function TodoItem({ todo, onToggle, onDelete, onEdit }) {
            const [isEditing, setIsEditing] = React.useState(false);
            const [editText, setEditText] = React.useState(todo.text);
            const [editPriority, setEditPriority] = React.useState(todo.priority);
            const [editCategory, setEditCategory] = React.useState(todo.category);
            const [editDueDate, setEditDueDate] = React.useState(todo.dueDate || '');

            const priorityColors = {
                low: '#28a745',
                medium: '#ffc107',
                high: '#dc3545'
            };

            const categoryIcons = {
                personal: '👤',
                work: '💼',
                study: '📚',
                shopping: '🛒',
                health: '🏃'
            };

            const handleSaveEdit = () => {
                if (editText.trim() === '') return;
                onEdit(todo.id, {
                    text: editText,
                    priority: editPriority,
                    category: editCategory,
                    dueDate: editDueDate
                });
                setIsEditing(false);
            };

            const isOverdue = todo.dueDate && !todo.completed && new Date(todo.dueDate) < new Date();
            const isToday = todo.dueDate && !todo.completed && new Date(todo.dueDate).toDateString() === new Date().toDateString();

            return (
                <div className="todo-item" style={{
                    borderRight: `4px solid ${priorityColors[todo.priority]}`,
                    opacity: todo.completed ? 0.7 : 1,
                    backgroundColor: todo.completed ? '#f8f9fa' : 'white'
                }}>
                    {isEditing ? (
                        <div>
                            <input
                                type="text"
                                value={editText}
                                onChange={(e) => setEditText(e.target.value)}
                                style={{ width: '100%', padding: '8px', marginBottom: '8px' }}
                            />
                            <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                                <select value={editPriority} onChange={(e) => setEditPriority(e.target.value)} style={{ padding: '5px' }}>
                                    <option value="low">🟢 کم</option>
                                    <option value="medium">🟡 متوسط</option>
                                    <option value="high">🔴 بالا</option>
                                </select>
                                <select value={editCategory} onChange={(e) => setEditCategory(e.target.value)} style={{ padding: '5px' }}>
                                    <option value="personal">👤 شخصی</option>
                                    <option value="work">💼 کاری</option>
                                    <option value="study">📚 درسی</option>
                                    <option value="shopping">🛒 خرید</option>
                                    <option value="health">🏃 سلامتی</option>
                                </select>
                                <input type="date" value={editDueDate} onChange={(e) => setEditDueDate(e.target.value)} style={{ padding: '5px' }} />
                                <button onClick={handleSaveEdit} style={{ padding: '5px 10px', backgroundColor: '#28a745', color: 'white', border: 'none', borderRadius: '5px' }}>💾 ذخیره</button>
                                <button onClick={() => setIsEditing(false)} style={{ padding: '5px 10px', backgroundColor: '#6c757d', color: 'white', border: 'none', borderRadius: '5px' }}>❌ انصراف</button>
                            </div>
                        </div>
                    ) : (
                        <div>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '8px' }}>
                                <input
                                    type="checkbox"
                                    checked={todo.completed}
                                    onChange={() => onToggle(todo.id)}
                                    style={{ width: '20px', height: '20px', cursor: 'pointer' }}
                                />
                                <span style={{
                                    flex: 1,
                                    textDecoration: todo.completed ? 'line-through' : 'none',
                                    fontSize: '16px',
                                    fontWeight: todo.priority === 'high' ? 'bold' : 'normal'
                                }}>
                                    {todo.text}
                                </span>
                                <button onClick={() => setIsEditing(true)} style={{ padding: '5px 10px', cursor: 'pointer' }}>✏️</button>
                                <button onClick={() => onDelete(todo.id)} style={{
                                    padding: '5px 10px',
                                    backgroundColor: '#dc3545',
                                    color: 'white',
                                    border: 'none',
                                    borderRadius: '5px',
                                    cursor: 'pointer'
                                }}>🗑️</button>
                            </div>
                            
                            <div style={{ display: 'flex', gap: '15px', fontSize: '12px', color: '#666', marginTop: '5px' }}>
                                <span>🔴 اولویت: {todo.priority === 'high' ? 'بالا' : todo.priority === 'medium' ? 'متوسط' : 'کم'}</span>
                                <span>{categoryIcons[todo.category]} دسته: {
                                    todo.category === 'personal' ? 'شخصی' :
                                    todo.category === 'work' ? 'کاری' :
                                    todo.category === 'study' ? 'درسی' :
                                    todo.category === 'shopping' ? 'خرید' : 'سلامتی'
                                }</span>
                                {todo.dueDate && (
                                    <span style={{ color: isOverdue ? '#dc3545' : isToday ? '#ffc107' : '#28a745' }}>
                                        📅 {isOverdue ? 'تاریخ گذشته!' : isToday ? 'امروز' : new Date(todo.dueDate).toLocaleDateString('fa-IR')}
                                    </span>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ==================== TodoList Component ====================
        function TodoList({ todos, onToggle, onDelete, onEdit }) {
            if (todos.length === 0) {
                return (
                    <div style={{
                        textAlign: 'center',
                        padding: '40px',
                        backgroundColor: '#f8f9fa',
                        borderRadius: '10px',
                        color: '#6c757d'
                    }}>
                        🎉 هیچ کاری برای نمایش وجود ندارد!
                        <br />
                        <span style={{ fontSize: '14px' }}>یک کار جدید اضافه کنید</span>
                    </div>
                );
            }

            return (
                <div>
                    {todos.map((todo) => (
                        <TodoItem
                            key={todo.id}
                            todo={todo}
                            onToggle={onToggle}
                            onDelete={onDelete}
                            onEdit={onEdit}
                        />
                    ))}
                </div>
            );
        }

        // ==================== FilterButtons Component ====================
        function FilterButtons({ filter, onFilterChange }) {
            const filters = [
                { name: 'همه', value: 'all', icon: '📋' },
                { name: 'انجام شده', value: 'completed', icon: '✅' },
                { name: 'انجام نشده', value: 'active', icon: '⏳' },
            ];

            return (
                <div style={{ display: 'flex', gap: '10px', marginBottom: '20px', justifyContent: 'center', flexWrap: 'wrap' }}>
                    {filters.map((f) => (
                        <button
                            key={f.value}
                            onClick={() => onFilterChange(f.value)}
                            style={{
                                padding: '8px 20px',
                                backgroundColor: filter === f.value ? '#007bff' : '#e9ecef',
                                color: filter === f.value ? 'white' : '#495057',
                                border: 'none',
                                borderRadius: '20px',
                                cursor: 'pointer',
                                fontSize: '14px',
                                fontWeight: filter === f.value ? 'bold' : 'normal'
                            }}
                        >
                            {f.icon} {f.name}
                        </button>
                    ))}
                </div>
            );
        }

        // ==================== StatsPanel Component ====================
        function StatsPanel({ todos }) {
            const total = todos.length;
            const completed = todos.filter(t => t.completed).length;
            const active = total - completed;
            const completionRate = total === 0 ? 0 : Math.round((completed / total) * 100);
            
            const highPriority = todos.filter(t => t.priority === 'high' && !t.completed).length;
            
            const todayDeadline = todos.filter(t => {
                if (!t.dueDate || t.completed) return false;
                return new Date(t.dueDate).toDateString() === new Date().toDateString();
            }).length;
            
            const overdue = todos.filter(t => {
                if (!t.dueDate || t.completed) return false;
                return new Date(t.dueDate) < new Date();
            }).length;

            return (
                <div style={{
                    backgroundColor: '#f8f9fa',
                    padding: '15px',
                    borderRadius: '10px',
                    marginTop: '20px'
                }}>
                    <h3 style={{ marginBottom: '15px', fontSize: '18px' }}>📊 آمار و گزارشات</h3>
                    
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(100px, 1fr))', gap: '10px', marginBottom: '15px' }}>
                        <div style={{ textAlign: 'center' }}>
                            <div style={{ fontSize: '24px', fontWeight: 'bold', color: '#007bff' }}>{total}</div>
                            <div style={{ fontSize: '12px', color: '#666' }}>کل کارها</div>
                        </div>
                        <div style={{ textAlign: 'center' }}>
                            <div style={{ fontSize: '24px', fontWeight: 'bold', color: '#28a745' }}>{completed}</div>
                            <div style={{ fontSize: '12px', color: '#666' }}>انجام شده</div>
                        </div>
                        <div style={{ textAlign: 'center' }}>
                            <div style={{ fontSize: '24px', fontWeight: 'bold', color: '#ffc107' }}>{active}</div>
                            <div style={{ fontSize: '12px', color: '#666' }}>انجام نشده</div>
                        </div>
                        <div style={{ textAlign: 'center' }}>
                            <div style={{ fontSize: '24px', fontWeight: 'bold', color: '#17a2b8' }}>{completionRate}%</div>
                            <div style={{ fontSize: '12px', color: '#666' }}>پیشرفت</div>
                        </div>
                    </div>
                    
                    <div style={{ marginBottom: '15px' }}>
                        <div style={{ backgroundColor: '#e0e0e0', borderRadius: '10px', height: '20px', overflow: 'hidden' }}>
                            <div style={{
                                width: `${completionRate}%`,
                                backgroundColor: '#28a745',
                                height: '100%',
                                transition: 'width 0.5s ease',
                                display: 'flex',
                                alignItems: 'center',
                                justifyContent: 'center',
                                color: 'white',
                                fontSize: '12px',
                                fontWeight: 'bold'
                            }}>
                                {completionRate}%
                            </div>
                        </div>
                    </div>
                    
                    {(todayDeadline > 0 || overdue > 0) && (
                        <div style={{
                            padding: '10px',
                            borderRadius: '8px',
                            backgroundColor: overdue > 0 ? '#fff3cd' : '#d1ecf1',
                            border: `1px solid ${overdue > 0 ? '#ffc107' : '#17a2b8'}`
                        }}>
                            {todayDeadline > 0 && <div>⏰ {todayDeadline} کار برای امروز deadline دارد!</div>}
                            {overdue > 0 && <div>⚠️ {overdue} کار دیرکرد دارند!</div>}
                        </div>
                    )}
                </div>
            );
        }

        // ==================== App Component ====================
        function App() {
            const [todos, setTodos] = useLocalStorage('todos_pro', []);
            const [filter, setFilter] = React.useState('all');
            const [categoryFilter, setCategoryFilter] = React.useState('all');
            const [searchTerm, setSearchTerm] = React.useState('');
            const [sortBy, setSortBy] = React.useState('date');

            const addTodo = (todoData) => {
                const newTodo = {
                    id: Date.now(),
                    text: todoData.text,
                    completed: false,
                    priority: todoData.priority,
                    category: todoData.category,
                    dueDate: todoData.dueDate,
                    createdAt: todoData.createdAt
                };
                setTodos([...todos, newTodo]);
            };

            const toggleTodo = (id) => {
                setTodos(
                    todos.map((todo) =>
                        todo.id === id ? { ...todo, completed: !todo.completed } : todo
                    )
                );
            };

            const deleteTodo = (id) => {
                if (window.confirm('آیا از حذف این کار مطمئن هستید؟')) {
                    setTodos(todos.filter((todo) => todo.id !== id));
                }
            };

            const editTodo = (id, updatedData) => {
                setTodos(
                    todos.map((todo) =>
                        todo.id === id ? { ...todo, ...updatedData } : todo
                    )
                );
            };

            const clearCompleted = () => {
                if (window.confirm('همه کارهای انجام شده حذف شوند؟')) {
                    setTodos(todos.filter((todo) => !todo.completed));
                }
            };

            const getSortedTodos = (todosList) => {
                switch(sortBy) {
                    case 'priority':
                        const priorityOrder = { high: 1, medium: 2, low: 3 };
                        return [...todosList].sort((a, b) => priorityOrder[a.priority] - priorityOrder[b.priority]);
                    case 'category':
                        return [...todosList].sort((a, b) => a.category.localeCompare(b.category));
                    case 'date':
                    default:
                        return [...todosList].sort((a, b) => b.id - a.id);
                }
            };

            const filteredTodos = getSortedTodos(todos.filter((todo) => {
                if (filter === 'completed') return todo.completed === true;
                if (filter === 'active') return todo.completed === false;
                return true;
            }).filter((todo) => {
                if (categoryFilter !== 'all' && todo.category !== categoryFilter) return false;
                return true;
            }).filter((todo) => {
                if (searchTerm === '') return true;
                return todo.text.toLowerCase().includes(searchTerm.toLowerCase());
            }));

            const categories = [
                { name: 'همه', value: 'all', icon: '📌' },
                { name: 'شخصی', value: 'personal', icon: '👤' },
                { name: 'کاری', value: 'work', icon: '💼' },
                { name: 'درسی', value: 'study', icon: '📚' },
                { name: 'خرید', value: 'shopping', icon: '🛒' },
                { name: 'سلامتی', value: 'health', icon: '🏃' },
            ];

            return (
                <div className="container">
                    <h1>✨ Todo List ✨</h1>
                    
                    <TodoForm onAdd={addTodo} />
                    
                    {/* Search Bar */}
                    <div style={{ marginBottom: '20px' }}>
                        <input
                            type="text"
                            value={searchTerm}
                            onChange={(e) => setSearchTerm(e.target.value)}
                            placeholder="🔍 جستجوی کارها..."
                            style={{
                                width: '100%',
                                padding: '10px 15px',
                                border: '2px solid #e0e0e0',
                                borderRadius: '25px',
                                fontSize: '14px'
                            }}
                        />
                    </div>
                    
                    {/* Category Filter */}
                    <div style={{ marginBottom: '20px' }}>
                        <div style={{ fontSize: '14px', marginBottom: '8px', color: '#666' }}>فیلتر بر اساس دسته:</div>
                        <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                            {categories.map((cat) => (
                                <button
                                    key={cat.value}
                                    onClick={() => setCategoryFilter(cat.value)}
                                    style={{
                                        padding: '6px 12px',
                                        backgroundColor: categoryFilter === cat.value ? '#28a745' : '#f8f9fa',
                                        color: categoryFilter === cat.value ? 'white' : '#495057',
                                        border: '1px solid #ddd',
                                        borderRadius: '15px',
                                        cursor: 'pointer',
                                        fontSize: '12px'
                                    }}
                                >
                                    {cat.icon} {cat.name}
                                </button>
                            ))}
                        </div>
                    </div>
                    
                    <FilterButtons filter={filter} onFilterChange={setFilter} />
                    
                    <div style={{ display: 'flex', justifyContent: 'flex-end', marginBottom: '15px', gap: '10px', alignItems: 'center' }}>
                        <span style={{ fontSize: '14px' }}>مرتب‌سازی بر اساس:</span>
                        <select 
                            value={sortBy} 
                            onChange={(e) => setSortBy(e.target.value)}
                            style={{ padding: '5px 10px', borderRadius: '5px', border: '1px solid #ddd' }}
                        >
                            <option value="date">تاریخ (جدیدترین)</option>
                            <option value="priority">اولویت</option>
                            <option value="category">دسته‌بندی</option>
                        </select>
                        
                        <button
                            onClick={clearCompleted}
                            style={{
                                padding: '5px 15px',
                                backgroundColor: '#6c757d',
                                color: 'white',
                                border: 'none',
                                borderRadius: '5px',
                                cursor: 'pointer',
                                fontSize: '12px'
                            }}
                        >
                            🧹 پاک کردن انجام شده‌ها
                        </button>
                    </div>
                    
                    <TodoList
                        todos={filteredTodos}
                        onToggle={toggleTodo}
                        onDelete={deleteTodo}
                        onEdit={editTodo}
                    />
                    
                    <StatsPanel todos={todos} />
                    
                    {searchTerm && (
                        <div style={{ textAlign: 'center', marginTop: '10px', fontSize: '12px', color: '#666' }}>
                            🔍 {filteredTodos.length} نتیجه برای "{searchTerm}"
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
